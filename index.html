<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgia Real Estate — myhome.ge catalog</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
h1{font-size:18px}h1 small{color:var(--muted);font-weight:400;font-size:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
select,button,input{background:var(--card);color:var(--text);border:1px solid var(--border);
border-radius:6px;padding:8px 10px;font-size:13px}
input[type=range]{accent-color:var(--accent)}
.stats{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;
display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card img{width:100%;height:150px;object-fit:cover;background:#222}
.card .noimg{width:100%;height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:#1c2128}
.card .body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.price{font-size:16px;font-weight:600}
.ppsm{color:var(--muted);font-size:12px}
.title{font-size:13px;line-height:1.3}
.meta{color:var(--muted);font-size:12px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:10px;padding:2px 6px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.badge.trust{font-weight:700}
.t-high{color:var(--green);border-color:var(--green)}
.t-mid{color:var(--yellow);border-color:var(--yellow)}
.t-low{color:var(--red);border-color:var(--red)}
.badge.dup{color:var(--yellow)}
.badge.canon{color:var(--accent)}
.badge.flag{color:var(--red);border-color:var(--red)}
.card a.link{display:block;padding:8px 12px;border-top:1px solid var(--border);color:var(--accent);
font-size:12px;text-decoration:none}
.filters-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;
padding:12px;margin:12px 20px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px}
.filters-panel label{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
#loading{display:none;padding:30px;text-align:center;color:var(--muted)}
.region-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.region-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);
color:var(--muted);cursor:pointer;font-size:13px;user-select:none}
.region-tab.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.region-tab small{opacity:.7}
</style>
</head>
<body>
<header>
  <h1>🏠 Georgia Real Estate <small>myhome.ge catalog · <span id="gen-date"></span></small></h1>
  <div class="region-tabs" id="regionTabs"></div>
  <div class="controls">
    <select id="district" style="display:none"></select>
    <select id="urban"><option value="">all sub-districts</option></select>
    <select id="deal"><option value="sale">For sale</option><option value="rent">For rent</option></select>
    <select id="sort">
      <option value="trust">Sort: trust ↓</option>
      <option value="price_asc">Sort: price ↑</option>
      <option value="price_desc">Sort: price ↓</option>
      <option value="ppsm_asc">Sort: price/m² ↑</option>
      <option value="ppsm_desc">Sort: price/m² ↓</option>
      <option value="newest">Sort: newest</option>
    </select>
    <input type="checkbox" id="hideDups" checked><label for="hideDups" style="font-size:12px">hide reposts</label>
    <input type="checkbox" id="onlyFlag"><label for="onlyFlag" style="font-size:12px">only flagged</label>
  </div>
  <div class="filters-panel">
    <label>min trust: <span id="trustVal">0</span><input type="range" id="trustMin" min="0" max="100" value="0"></label>
    <label>price from: <input type="number" id="priceFrom" style="width:90px"></label>
    <label>price to: <input type="number" id="priceTo" style="width:90px"></label>
    <label>area from (m²): <input type="number" id="areaFrom" style="width:70px"></label>
    <label>area to (m²): <input type="number" id="areaTo" style="width:70px"></label>
    <label>$/m² from: <input type="number" id="ppsmFrom" style="width:70px"></label>
    <label>$/m² to: <input type="number" id="ppsmTo" style="width:70px"></label>
    <label>rooms: <select id="rooms"><option value="">any</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>bedrooms: <select id="bedrooms"><option value="">any</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>floor: <select id="floorSel"><option value="">any</option><option value="ground">ground</option><option value="top">top floor</option><option value="notground">not ground</option></select></label>
    <button id="clear">Clear</button>
    <span class="stats" id="stats"></span>
  </div>
</header>
<div class="grid" id="grid"></div>
<div id="loading">loading more…</div>
<script>
const $=id=>document.getElementById(id);
let REGIONS={}, CUR="", DATA=[], filtered=[], shown=0, PAGE=24;
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function init(){
  REGIONS = await fetch("data/regions.json").then(r=>r.json());
  $("gen-date").textContent = new Date().toISOString().slice(0,10);
  const tabs = Object.entries(REGIONS).map(([k,v])=>{
    const total = Object.values(v.groups).reduce((a,g)=>a+g.count,0);
    return `<div class="region-tab" data-r="${esc(k)}">${esc(v.label)} <small>${total.toLocaleString()}</small></div>`;
  }).join("");
  $("regionTabs").innerHTML = tabs;
  document.querySelectorAll(".region-tab").forEach(t=>{
    t.onclick = ()=>{ document.querySelectorAll(".region-tab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active"); CUR = t.dataset.r; onRegion(); };
  });
  const p = new URLSearchParams(location.search);
  CUR = (p.get("r") && REGIONS[p.get("r")]) ? p.get("r") : Object.keys(REGIONS)[0];
  const tabEl = document.querySelector(`.region-tab[data-r="${CUR}"]`);
  if(tabEl) tabEl.classList.add("active");

  $("deal").onchange = onDeal;
  $("district").onchange = onDeal;
  $("urban").onchange = $("sort").onchange =
    $("priceFrom").oninput = $("priceTo").oninput = $("areaFrom").oninput =
    $("areaTo").oninput = $("ppsmFrom").oninput = $("ppsmTo").oninput =
    $("rooms").onchange = $("bedrooms").onchange = $("floorSel").onchange =
    $("hideDups").onchange = $("onlyFlag").onchange = apply;
  $("trustMin").oninput = e=>{$("trustVal").textContent = e.target.value; apply();};
  $("clear").onclick = ()=>{["priceFrom","priceTo","areaFrom","areaTo","ppsmFrom","ppsmTo"].forEach(k=>$(k).value="");
    $("rooms").value="";$("bedrooms").value="";$("floorSel").value="";$("trustMin").value=0;$("trustVal").textContent="0";
    $("onlyFlag").checked=false;apply();};
  window.addEventListener("scroll", ()=>{
    if(shown < filtered.length &&
       window.innerHeight + window.scrollY > document.body.offsetHeight - 400) render();});
  onRegion();
}

function regionConf(){ return REGIONS[CUR]; }

function locKeys(){
  return [...new Set(Object.keys(regionConf().groups).map(k=>k.split("|")[0]))];
}

function onRegion(){
  const locs = locKeys();
  const ds = $("district");
  ds.style.display = locs.length > 1 ? "" : "none";
  if(locs.length > 1){
    ds.innerHTML = locs.map(l=>{
      const tot = Object.entries(regionConf().groups)
        .filter(([k])=>k.startsWith(l+"|")).reduce((a,[,g])=>a+g.count,0);
      return `<option value="${esc(l)}">${esc(l)} (${tot.toLocaleString()})</option>`;
    }).join("");
  }
  onDeal();
}

async function onDeal(){
  const conf = regionConf();
  const loc = $("district").style.display !== "none" ? $("district").value : locKeys()[0];
  const deal = $("deal").value;
  const g = conf.groups[`${loc}|${deal}`];
  $("grid").innerHTML = ""; $("stats").textContent = "loading…";
  if(!g){ $("stats").textContent = "no listings"; DATA=[]; filtered=[]; return; }
  const idx = await fetch(`data/${CUR}/${g.slug}/index.json`).then(r=>r.json());
  $("urban").innerHTML = '<option value="">all sub-districts</option>' +
    (idx.urbans||[]).map(u=>`<option value="${esc(u.name)}">${esc(u.name)} (${u.count})</option>`).join("");
  const parts = await Promise.all(g.chunks.map(c=>
    fetch(`data/${CUR}/${g.slug}/${c}`).then(r=>r.blob())
      .then(b=>new Response(b.stream().pipeThrough(new DecompressionStream("gzip"))).json())));
  DATA = parts.flat();
  apply();
}

function apply(){
  const trust = +$("trustMin").value;
  const pf = +$("priceFrom").value || 0, pt = +$("priceTo").value || Infinity;
  const amin = +$("areaFrom").value || 0, amax = +$("areaTo").value || Infinity;
  const sqf = +$("ppsmFrom").value || 0, sqt = +$("ppsmTo").value || Infinity;
  const rooms = $("rooms").value;
  const bedrooms = $("bedrooms").value;
  const floorSel = $("floorSel").value;
  const urbanSel = $("urban").value;
  const hideDups = $("hideDups").checked, onlyFlag = $("onlyFlag").checked;
  filtered = DATA.filter(r=>{
    if(r.trust_score < trust) return false;
    if(r.price && (r.price < pf || r.price > pt)) return false;
    if(r.area_m2 && (r.area_m2 < amin || r.area_m2 > amax)) return false;
    if(r.price_per_m2 && (r.price_per_m2 < sqf || r.price_per_m2 > sqt)) return false;
    if(rooms && String(r.rooms) !== rooms) return false;
    if(bedrooms && String(r.bedrooms||"") !== bedrooms) return false;
    if(floorSel === "ground" && !(r.floors && r.floor === 1)) return false;
    if(floorSel === "notground" && r.floor === 1) return false;
    if(floorSel === "top" && !(r.floors && r.floor === r.floors)) return false;
    if(urbanSel && (r.urban||"—") !== urbanSel) return false;
    const isDup = r.flags && r.flags.includes("duplicate");
    if(hideDups && isDup) return false;
    if(onlyFlag && !(r.flags||[]).some(f=>f!=="dup-canonical")) return false;
    return true;
  });
  const s = $("sort").value;
  const cmp = {trust:(a,b)=>b.trust_score-a.trust_score,
    price_asc:(a,b)=>(a.price||1e12)-(b.price||1e12),
    price_desc:(a,b)=>(b.price||0)-(a.price||0),
    ppsm_asc:(a,b)=>(a.price_per_m2||1e9)-(b.price_per_m2||1e9),
    ppsm_desc:(a,b)=>(b.price_per_m2||0)-(a.price_per_m2||0),
    newest:(a,b)=>String(b.last_updated).localeCompare(String(a.last_updated))}[s];
  filtered.sort(cmp);
  shown = 0; $("grid").innerHTML=""; render();
}

function badgeHtml(r){
  const t = r.trust_score;
  const cls = t>=70?"t-high":t>=45?"t-mid":"t-low";
  let b = `<span class="badge trust ${cls}">trust ${t}</span>`;
  (r.flags||[]).forEach(f=>{
    if(f==="duplicate") b += `<span class="badge dup">repost</span>`;
    else if(f==="dup-canonical") b += `<span class="badge canon">original</span>`;
    else b += `<span class="badge flag">${esc(f.split("?")[0])}</span>`;
  });
  if(r.vip) b += `<span class="badge">VIP</span>`;
  if(r.has_3d_tour) b += `<span class="badge">3D</span>`;
  return b;
}

function render(){
  const frag = document.createDocumentFragment();
  const end = Math.min(shown + PAGE, filtered.length);
  for(let i=shown;i<end;i++){
    const r = filtered[i];
    const div = document.createElement("div");
    div.className = "card" + ((r.flags||[]).includes("duplicate") ? " dup" : "");
    const img = r.first_photo
      ? `<img src="${r.first_photo}" alt="">`
      : `<div class="noimg">no photos</div>`;
    const price = r.price ? `${r.price.toLocaleString()} ${r.currency}` : "price on request";
    const ppsm = r.price_per_m2 ? ` · ${Math.round(r.price_per_m2).toLocaleString()}/m²` : "";
    const area = r.area_m2 ? `${r.area_m2} m²` : "";
    const yard = r.yard_area_m2 ? ` · yard ${r.yard_area_m2} m²` : "";
    const fl = r.floor && r.floors ? ` · floor ${r.floor}/${r.floors}` : (r.floors ? ` · ${r.floors} fl` : "");
    div.innerHTML = `${img}
      <div class="body">
        <div class="price">${price}<span class="ppsm">${ppsm}</span></div>
        <div class="title">${esc(r.title)}</div>
        <div class="meta">${area}${yard}${fl}${r.rooms?` · ${r.rooms} rooms`:""}${r.bedrooms?` · ${r.bedrooms} bd`:""}</div>
        <div class="meta">📍 ${esc(r.address || r.urban || "")}${r.urban?` · ${esc(r.urban)}`:""}</div>
        <div class="meta">👤 ${esc(r.seller_name||"?")} (${r.seller_type||"?"}) · ${r.days_listed||"?"}d · ${r.photo_count||0} photos</div>
        <div class="badges">${badgeHtml(r)}</div>
      </div>
      <a class="link" href="${r.url}" target="_blank" rel="noopener">view on myhome.ge ↗</a>`;
    frag.appendChild(div);
  }
  $("grid").appendChild(frag);
  shown = end;
  $("stats").textContent = `${filtered.length.toLocaleString()} shown / ${DATA.length.toLocaleString()} total`;
}

init();
</script>
</body>
</html>
